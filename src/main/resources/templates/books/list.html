<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Catalog - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="main-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="content-area">

            <!-- Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Page Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Books Catalog</h3>
                    <p class="text-muted mb-0">Browse, search, and manage books inventory</p>
                </div>
                <a th:href="@{/books/add}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> Add New Book
                </a>
            </div>

            <!-- Search Filter Bar -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <form th:action="@{/books}" method="get" class="row g-3 align-items-center">
                        <div class="col-md-9">
                            <div class="search-box w-100 max-w-none">
                                <i class="bi bi-search"></i>
                                <input type="text" name="query" th:value="${query}" class="form-control form-control-lg" placeholder="Search by Title, Author, ISBN, or Category...">
                            </div>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-funnel me-1"></i> Search
                            </button>
                            <a th:href="@{/books}" class="btn btn-light border py-2">Reset</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Books Table -->
            <div class="custom-table-container">
                <div class="table-responsive">
                    <table class="table align-middle filterable-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Book Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Category</th>
                                <th>Total Stock</th>
                                <th>Available</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book, iter : ${books}">
                                <td th:text="${iter.count}">1</td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${book.title}">Title</div>
                                    <small class="text-muted" th:text="${book.publisher}">Publisher</small>
                                </td>
                                <td th:text="${book.author}">Author</td>
                                <td class="font-monospace text-secondary" th:text="${book.isbn}">ISBN</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${book.category}">Category</span>
                                </td>
                                <td class="fw-semibold" th:text="${book.quantity}">0</td>
                                <td class="fw-bold text-primary" th:text="${book.availableQuantity}">0</td>
                                <td>
                                    <span class="badge-status badge-available" th:if="${book.availableQuantity > 0}">
                                        <i class="bi bi-check-circle-fill"></i> AVAILABLE
                                    </span>
                                    <span class="badge-status badge-out-of-stock" th:if="${book.availableQuantity <= 0}">
                                        <i class="bi bi-x-circle-fill"></i> OUT OF STOCK
                                    </span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/issue(bookId=${book.id})}" th:classappend="${book.availableQuantity <= 0} ? 'disabled' : ''" class="btn btn-outline-primary" title="Issue Book">
                                            <i class="bi bi-box-arrow-up-right"></i> Issue
                                        </a>
                                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-secondary" title="Edit Book">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-outline-danger confirm-delete" th:attr="data-item-name=${book.title}" title="Delete Book">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(books)}">
                                <td colspan="9" class="text-center py-5 text-muted">
                                    <i class="bi bi-journal-x fs-1 d-block mb-2 text-secondary"></i>
                                    <h5>No books found</h5>
                                    <p class="small text-muted mb-0">Try clearing your search or add a new book to the catalog.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
