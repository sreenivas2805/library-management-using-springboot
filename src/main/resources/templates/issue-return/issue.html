<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="main-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="content-area">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Issue Book</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-card">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="bg-primary text-white rounded-3 p-3">
                                <i class="bi bi-box-arrow-up-right fs-3"></i>
                            </div>
                            <div>
                                <h4 class="fw-bold mb-0">Issue Book to Student</h4>
                                <small class="text-muted">Select a registered student and available book to record issue</small>
                            </div>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/issue}" th:object="${issueRequest}" method="post">
                            <div class="row g-3">

                                <!-- Student Selector -->
                                <div class="col-md-12">
                                    <label for="studentId" class="form-label">Select Student <span class="text-danger">*</span></label>
                                    <select id="studentId" th:field="*{studentId}" class="form-select form-select-lg" th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">
                                        <option value="">-- Search & Choose Student --</option>
                                        <option th:each="student : ${students}"
                                                th:value="${student.id}"
                                                th:text="${student.name + ' (' + student.rollNumber + ' - ' + student.department + ')'}">
                                            Alex Johnson (CS-2024-001)
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}">Student selection error</div>
                                </div>

                                <!-- Book Selector -->
                                <div class="col-md-12">
                                    <label for="bookId" class="form-label">Select Book <span class="text-danger">*</span></label>
                                    <select id="bookId" th:field="*{bookId}" class="form-select form-select-lg" th:classappend="${#fields.hasErrors('bookId')} ? 'is-invalid' : ''">
                                        <option value="">-- Choose Book from Inventory --</option>
                                        <option th:each="book : ${books}"
                                                th:value="${book.id}"
                                                th:disabled="${book.availableQuantity <= 0}"
                                                th:text="${book.title + ' by ' + book.author + ' [Avail: ' + book.availableQuantity + '/' + book.quantity + ']'}">
                                            Clean Code (Avail: 4/5)
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bookId')}" th:errors="*{bookId}">Book selection error</div>
                                </div>

                                <!-- Due Date Picker -->
                                <div class="col-md-6">
                                    <label for="dueDate" class="form-label">Due Date <span class="text-danger">*</span></label>
                                    <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control" th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">Due date error</div>
                                    <small class="text-muted">Standard lending period is 14 days</small>
                                </div>

                                <!-- Notes -->
                                <div class="col-md-6">
                                    <label for="notes" class="form-label">Remarks / Notes</label>
                                    <input type="text" id="notes" th:field="*{notes}" class="form-control" placeholder="e.g. Reference for semester exam">
                                </div>

                            </div>

                            <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                                <a th:href="@{/dashboard}" class="btn btn-light border px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Issue Book Now
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
