<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg text-center p-5 rounded-4 max-w-lg" style="max-width: 500px;">
            <div class="mb-4">
                <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 90px; height: 90px;">
                    <i class="bi bi-exclamation-octagon fs-1"></i>
                </div>
            </div>
            <h1 class="fw-bold text-dark mb-2" th:text="${errorCode != null ? errorCode : '404 - Page Not Found'}">404 - Page Not Found</h1>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.'}">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary btn-lg px-4 rounded-pill">
                    <i class="bi bi-house-door-fill me-2"></i> Return to Dashboard
                </a>
            </div>
        </div>
        <div class="mt-4 text-center text-muted small">
            Library Management System &bull; Spring Boot 3.2
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
